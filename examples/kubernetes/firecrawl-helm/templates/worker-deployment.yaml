apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl.name" . }}-worker
  labels:
    app: {{ include "firecrawl.name" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "firecrawl.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "firecrawl.name" . }}-worker
    spec:
      {{- if .Values.dockerSecretEnabled }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: [ "node", "--import", "./dist/src/otel.js", "dist/src/services/queue-worker.js" ]
          env:
            - name: FLY_PROCESS_GROUP
              value: "worker"
          envFrom:
            - configMapRef:
                name: {{ include "firecrawl.name" . }}-config
            - secretRef:
                name: {{ include "firecrawl.name" . }}-secret
          {{- if .Values.worker.resources }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- end }}
