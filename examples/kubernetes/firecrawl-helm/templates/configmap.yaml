apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firecrawl.name" . }}-config
data:
  NUM_WORKERS_PER_QUEUE: {{ .Values.config.NUM_WORKERS_PER_QUEUE | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  HOST: {{ .Values.config.HOST | quote }}
  REDIS_URL: {{ .Values.config.REDIS_URL | default (printf "redis://%s-redis:6379" (include "firecrawl.name" .)) | quote }}
  REDIS_RATE_LIMIT_URL: {{ .Values.config.REDIS_RATE_LIMIT_URL | default (printf "redis://%s-redis:6379" (include "firecrawl.name" .)) | quote }}
  PLAYWRIGHT_MICROSERVICE_URL: {{ .Values.config.PLAYWRIGHT_MICROSERVICE_URL | default (printf "http://%s-playwright:3000/scrape" (include "firecrawl.name" .)) | quote }}
  USE_DB_AUTHENTICATION: {{ .Values.config.USE_DB_AUTHENTICATION | quote }}
  HDX_NODE_BETA_MODE: {{ .Values.config.HDX_NODE_BETA_MODE | quote }}
  NUQ_DATABASE_URL: {{ .Values.config.NUQ_DATABASE_URL | default (printf "postgresql://postgres:password@%s-nuq-postgres:5432/postgres" (include "firecrawl.name" .)) | quote }}
