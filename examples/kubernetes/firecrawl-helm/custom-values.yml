api:
  replicaCount: 1
  image:
    repository: harbor.tenea.com/firecrawl/api
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      memory: "2G"
      cpu: "500m"
    limits:
      memory: "3G"
      cpu: "1000m"

worker:
  replicaCount: 1
  image:
    repository: harbor.tenea.com/firecrawl/api
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      memory: "2G"
      cpu: "500m"
    limits:
      memory: "3G"
      cpu: "1000m"

nuqWorker:
  replicaCount: 5
  image:
    repository: harbor.tenea.com/firecrawl/api
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      memory: "3G"
      cpu: "1000m"
    limits:
      memory: "4G"
      cpu: "1000m"

nuqPostgres:
  replicaCount: 1
  image:
    repository: harbor.tenea.com/firecrawl/nuq-postgres
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  persistence:
    enabled: true

dockerSecretEnabled: true

playwright:
  replicaCount: 1
  image:
    repository: harbor.tenea.com/firecrawl/playwright-service
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      memory: "1G"
      cpu: "500m"
    limits:
      memory: "2G"
      cpu: "1000m"

redis:
  image: redis:alpine
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  api:
    type: NodePort
    port: 3002
    nodePort: 30083
  playwright:
    type: ClusterIP
    port: 3000
  redis:
    type: ClusterIP
    port: 6379

config:
  NUM_WORKERS_PER_QUEUE: "8"
  PORT: "3002"
  HOST: "0.0.0.0"
  REDIS_URL: ""  # Auto-generated: redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
  REDIS_RATE_LIMIT_URL: ""  # Auto-generated: redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
  PLAYWRIGHT_MICROSERVICE_URL: ""  # Auto-generated: http://{{ .Release.Name }}-playwright.{{ .Release.Namespace }}.svc.cluster.local:3000/scrape
  USE_DB_AUTHENTICATION: "false"
  HDX_NODE_BETA_MODE: "1"
  NUQ_DATABASE_URL: ""  # Auto-generated: postgresql://postgres:password@{{ .Release.Name }}-nuq-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/postgres

playwrightConfig:
  PORT: "3000"

secret:
  OPENAI_API_KEY: ""
  SLACK_WEBHOOK_URL: ""
  LLAMAPARSE_API_KEY: ""
  BULL_AUTH_KEY: ""
  # TEST_API_KEY: "fc-7d71c9e6e387160e907eea9a1c03012de0f064cb5a1651413cf71d63b5b69f32"
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: ""
  SCRAPING_BEE_API_KEY: ""
  STRIPE_PRICE_ID_STANDARD: ""
  STRIPE_PRICE_ID_SCALE: ""
  FIRE_ENGINE_BETA_URL: ""
  REDIS_PASSWORD: ""

imagePullSecrets:
  - name: harbor
