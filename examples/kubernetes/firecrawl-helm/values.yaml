api:
  replicaCount: 1
  image:
    repository: ghcr.io/firecrawl/firecrawl
    tag: "latest"
    pullPolicy: Always

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/firecrawl/firecrawl
    tag: "latest"
    pullPolicy: Always

nuqWorker:
  replicaCount: 5
  image:
    repository: ghcr.io/firecrawl/firecrawl
    tag: "latest"
    pullPolicy: Always

nuqPostgres:
  replicaCount: 1
  image:
    repository: ghcr.io/firecrawl/nuq-postgres
    tag: latest
    pullPolicy: Always
  auth:
    username: postgres
    database: postgres
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

dockerSecretEnabled: true

playwright:
  replicaCount: 1
  image:
    repository: ghcr.io/firecrawl/playwright-service
    tag: "latest"
    pullPolicy: Always

redis:
  image: redis:alpine
  replicaCount: 1

service:
  api:
    type: ClusterIP
    port: 3002
  playwright:
    type: ClusterIP
    port: 3000
  redis:
    type: ClusterIP
    port: 6379

config:
  NUM_WORKERS_PER_QUEUE: "8"
  PORT: "3002"
  HOST: "0.0.0.0"
  REDIS_URL: ""  # Auto-generated: redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
  REDIS_RATE_LIMIT_URL: ""  # Auto-generated: redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
  PLAYWRIGHT_MICROSERVICE_URL: ""  # Auto-generated: http://{{ .Release.Name }}-playwright.{{ .Release.Namespace }}.svc.cluster.local:3000/scrape
  USE_DB_AUTHENTICATION: "false"
  HDX_NODE_BETA_MODE: "1"
  NUQ_DATABASE_URL: ""  # Auto-generated: postgresql://postgres:password@{{ .Release.Name }}-nuq-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/postgres

playwrightConfig:
  PORT: "3000"

secret:
  OPENAI_API_KEY: ""
  SLACK_WEBHOOK_URL: ""
  LLAMAPARSE_API_KEY: ""
  BULL_AUTH_KEY: ""
  TEST_API_KEY: ""
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: ""
  SCRAPING_BEE_API_KEY: ""
  STRIPE_PRICE_ID_STANDARD: ""
  STRIPE_PRICE_ID_SCALE: ""
  FIRE_ENGINE_BETA_URL: ""
  REDIS_PASSWORD: ""

imagePullSecrets:
  - name: docker-registry-secret
